name: Gerçek veri kontrolü

# Faz 1 bitme şartı: 5 strateji çekirdek evrendeki bütün varlıklarda gerçek fiyatlarla çalışıyor mu?
# İnternete (Yahoo) çıktığı için testlerden ayrıdır; sadece elle çalıştırılır.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Başlangıç tarihi"
        required: false
        default: "2015-01-01"

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: bash setup.sh
      - name: Beş strateji × 21 varlık
        run: python .github/kontrol/gercek_veri.py "${{ inputs.start || '2015-01-01' }}" | tee sonuc.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gercek-veri-sonuc
          path: sonuc.md
