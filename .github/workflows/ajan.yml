name: Ajan

# Kodlama ajanı: her gün BACKLOG.md'deki sıradaki görevi yapar ve öneri (PR) açar.
# Motor: .github/ajan/ajan.py. Görevi 2–5 model isteğinde bitirir (önce testler, sonra kod,
# gerekirse düzeltme); bu yüzden Gemini API'nin ücretsiz katmanına sığar.
# Öneriyi ajan değil, bu iş akışının son adımı açar; ana dala hiçbir zaman yazılmaz.
# Ajanın önerisi birleştirilince hemen sıradaki göreve başlar; hız inceleme hızına bağlıdır.
# Yarım kalan iş (kota dolması, geçmeyen testler) taslak/G-xxx dalına kaydedilir ve
# sonraki çalışma oradan devam eder.

on:
  schedule:
    # Her gün 08:41 UTC (Berlin kışın 09:41, yazın 10:41). Gemini'nin günlük kotası
    # Pasifik saatiyle gece yarısı (Berlin 09:00) sıfırlanır; çalışma hep sıfırlamadan sonra olur.
    - cron: "41 8 * * *"
    # Yedek saat: ilki çalışmazsa ya da yarıda kalırsa (ör. Google'ın sunucuları cevap vermezse)
    # aynı gün devam edilir. Açık öneri varsa bu çalışma hiçbir şey yapmaz.
    - cron: "41 14 * * *"
  pull_request:
    types: [closed] # ajanın önerisi birleştirilince sıradaki göreve geç
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için
    inputs:
      model:
        description: "Model adı (boş bırakılırsa varsayılan)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ajan
  cancel-in-progress: false

jobs:
  ajan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'ajan/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-flash-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Çalışmalı mı?
        id: kontrol
        env:
          ANAHTAR_VAR: ${{ secrets.GEMINI_API_KEY != '' }}
          EN_FAZLA_ACIK: ${{ vars.AJAN_EN_FAZLA_ACIK || '1' }}
        run: |
          # Ajanın açık önerisi birleştirilmeden yeni görev alınmaz (bkz. KARARLAR.md).
          acik=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("ajan/"))] | length')
          if [ "$acik" -ge "$EN_FAZLA_ACIK" ]; then
            echo "Ajanın $acik açık önerisi var; önce incelenip birleştirilmeli ya da kapatılmalı." >> "$GITHUB_STEP_SUMMARY"
            echo "calis=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q '^## \[ \]' BACKLOG.md; then
            echo "BACKLOG.md'de bekleyen görev yok." >> "$GITHUB_STEP_SUMMARY"
            echo "calis=false" >> "$GITHUB_OUTPUT"
          elif [ "$ANAHTAR_VAR" != "true" ]; then
            echo "GEMINI_API_KEY gizli değişkeni henüz eklenmemiş; ajan çalışmadı." >> "$GITHUB_STEP_SUMMARY"
            echo "calis=false" >> "$GITHUB_OUTPUT"
          else
            echo "calis=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.kontrol.outputs.calis == 'true'
        with:
          python-version: "3.12"

      - name: Kurulum
        if: steps.kontrol.outputs.calis == 'true'
        run: bash setup.sh

      - name: Ajanı çalıştır
        if: steps.kontrol.outputs.calis == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/ajan/ajan.py

      - name: Yarım kalan işi kaydet
        if: failure() && hashFiles('.ajan-taslak.json') != ''
        run: |
          gorev=$(jq -r .task_id .ajan-taslak.json)
          dal="taslak/$gorev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$dal"
          git add .ajan-taslak.json
          jq -r '.files[]' .ajan-taslak.json | xargs -r git add --
          git commit -q -m "Taslak: $gorev (yarım kalan çalışma)"
          git push --force origin "$dal"
          echo "Yarım kalan iş \`$dal\` dalına kaydedildi; sonraki çalışma buradan devam edecek." >> "$GITHUB_STEP_SUMMARY"

      - name: Testleri doğrula
        if: steps.kontrol.outputs.calis == 'true'
        run: python -m pytest

      - name: Korunan dosyaları kontrol et
        if: steps.kontrol.outputs.calis == 'true'
        run: |
          degisen=$(git status --porcelain | awk '{print $2}')
          for yasak in HEDEF.md AGENTS.md DERSLER.md .github/; do
            if echo "$degisen" | grep -q "^$yasak"; then
              echo "Ajan korunan bir dosyayı değiştirdi: $yasak" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Öneri aç
        if: steps.kontrol.outputs.calis == 'true'
        run: |
          if [ ! -s .ajan/pr_baslik.txt ]; then
            echo "Ajan öneri başlığı yazmadı; öneri açılmadı." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok; öneri açılmadı." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          baslik=$(head -n 1 .ajan/pr_baslik.txt)
          dal="ajan/$(date +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$dal"
          git add -A
          git commit -m "$baslik"
          git push origin "$dal"
          cp .ajan/pr_aciklama.md /tmp/aciklama.md 2>/dev/null || echo "(Ajan açıklama yazmadı.)" > /tmp/aciklama.md
          {
            echo ""
            echo "---"
            echo "Testler bu çalışmada geçti: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> /tmp/aciklama.md
          gh pr create --base main --head "$dal" --title "$baslik" --body-file /tmp/aciklama.md
          echo "Öneri açıldı: $baslik" >> "$GITHUB_STEP_SUMMARY"
          # Görev bittiği için varsa taslak dalı silinir.
          git push origin --delete "taslak/${baslik%%:*}" 2>/dev/null || true
