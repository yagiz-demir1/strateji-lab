name: Yedek

# Ana daldaki projeyi ayrı bir gizli GitHub deposuna (strateji-lab-yedek) kopyalar.
# Zorla yazmaz: geçmiş beklenmedik şekilde değişirse kopyalama durur ve hata verir,
# böylece yedek hiçbir zaman bozuk bir sürümle ezilmez.
# Gereken: YEDEK_TOKEN gizli değişkeni (sadece yedek deposuna yazma izni olan anahtar).
# Yedek deposunun adresi YEDEK_REPO depo değişkeniyle değiştirilebilir.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0" # her pazar 04:23 UTC, ayrıca güvence olarak
  workflow_dispatch:

jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GitHub'ın geçici anahtarı saklanmasın; yoksa git YEDEK_TOKEN yerine onu kullanır (403).
          persist-credentials: false

      - name: Yedek depoya kopyala
        env:
          YEDEK_TOKEN: ${{ secrets.YEDEK_TOKEN }}
          YEDEK_REPO: ${{ vars.YEDEK_REPO || 'github.com/yagiz-demir1/strateji-lab-yedek.git' }}
        run: |
          if [ -z "$YEDEK_TOKEN" ]; then
            echo "YEDEK_TOKEN henüz eklenmemiş; yedek alınmadı." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push "https://x-access-token:${YEDEK_TOKEN}@${YEDEK_REPO}" HEAD:refs/heads/main --tags
          echo "Yedek alındı: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
